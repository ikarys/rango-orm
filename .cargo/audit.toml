[advisories]
# rsa (Marvin attack, timing side channel on RSA *decryption* with a private key):
# sqlx-mysql only uses rsa to *encrypt* the password with the server's public key
# (caching_sha2_password over a non-TLS connection). No private-key operation, so
# the attack does not apply. No fixed rsa release exists yet; re-check on sqlx bumps.
ignore = ["RUSTSEC-2023-0071"]
