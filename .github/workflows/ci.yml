name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/rango_test

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  package:
    name: Package, docs & MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo doc (warnings are errors)
        run: cargo +stable doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: cargo publish --dry-run
        run: cargo +stable publish --workspace --dry-run --locked

      - name: cargo check (MSRV)
        run: cargo +1.89 check --workspace --all-features --all-targets --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test (unit)
        run: cargo test --workspace

      - name: cargo test (SQLite integration — in-memory)
        run: cargo test --test integration_sqlite --features rango-tests/integration-sqlite -- --test-threads=1

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test (integration)
        run: cargo test --workspace --features rango-tests/integration,rango-orm-cli/integration -- --test-threads=1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rango_test

  integration-mysql:
    name: Integration tests (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: "MySQL 8.0", image: "mysql:8.0", health: "mysqladmin ping -h 127.0.0.1 -prango" }
          - { name: "MySQL 8.4", image: "mysql:8.4", health: "mysqladmin ping -h 127.0.0.1 -prango" }
          - { name: "MariaDB 10.6", image: "mariadb:10.6", health: "healthcheck.sh --connect --innodb_initialized" }
          - { name: "MariaDB 11.4", image: "mariadb:11.4", health: "healthcheck.sh --connect --innodb_initialized" }

    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: rango
          MYSQL_DATABASE: rango_test
          MARIADB_ROOT_PASSWORD: rango
          MARIADB_DATABASE: rango_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.db.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-integration-mysql-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test (integration, mysql)
        run: cargo test --test integration_mysql --features rango-tests/integration-mysql -- --test-threads=1
        env:
          MYSQL_URL: mysql://root:rango@127.0.0.1:3306/rango_test

      - name: cargo test (CLI e2e, mysql)
        run: cargo test -p rango-orm-cli --test migrations_e2e_mysql --features integration-mysql -- --test-threads=1
        env:
          MYSQL_URL: mysql://root:rango@127.0.0.1:3306/rango_test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: >
          cargo llvm-cov --workspace
          --features rango-tests/integration,rango-tests/integration-sqlite
          --lcov --output-path lcov.info
          -- --test-threads=1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rango_test

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Coverage threshold is informational only — CI never blocks on it.
      # Check the Codecov badge in README for current coverage.
