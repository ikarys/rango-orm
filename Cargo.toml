[workspace]
members = [
    "rango-orm",
    "rango-orm-cli",
    "rango-bench",
    "rango-orm-core",
    "rango-orm-derive",
    "rango-orm-postgres",
    "rango-orm-sqlite",
    "rango-orm-mysql",
    "rango-tests",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["Ikarys"]
repository = "https://github.com/ikarys/rango-orm"
homepage = "https://ikarys.github.io/rango-orm/"

[workspace.dependencies]
rango-orm-core = { path = "rango-orm-core", version = "=0.2.0" }
rango-orm-derive = { path = "rango-orm-derive", version = "=0.2.0" }
rango-orm-postgres = { path = "rango-orm-postgres", version = "=0.2.0" }
rango-orm-sqlite = { path = "rango-orm-sqlite", version = "=0.2.0" }
rango-orm-mysql = { path = "rango-orm-mysql", version = "=0.2.0" }
