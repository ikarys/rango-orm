[package]
name = "bench-diesel"
version = "0.1.0"
edition = "2024"
publish = false

[dev-dependencies]
diesel = { version = "2.3", features = ["postgres_backend", "uuid", "chrono"], default-features = false }
diesel-async = { version = "0.9", features = ["postgres", "deadpool"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "postgres"
path = "benches/postgres.rs"
harness = false
