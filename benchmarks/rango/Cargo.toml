[package]
name = "bench-rango"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
rango-orm-core   = { path = "../../rango-orm-core" }
rango-orm-derive = { path = "../../rango-orm-derive" }
rango-orm-postgres = { path = "../../rango-orm-postgres" }
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }

[[bench]]
name = "postgres"
harness = false
