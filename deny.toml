# cargo-deny: `just deny` (also run by the manual CI workflow).

[advisories]
# Same exception as .cargo/audit.toml (rsa is only used to encrypt with the
# server's public key, the Marvin attack does not apply). Re-check on sqlx bumps.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
