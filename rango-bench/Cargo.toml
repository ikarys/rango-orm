[package]
name = "rango-bench"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dev-dependencies]
rango-orm-core = { path = "../rango-orm-core" }
rango-orm-derive = { path = "../rango-orm-derive" }
rango-orm-postgres = { path = "../rango-orm-postgres" }
rango-orm-sqlite = { path = "../rango-orm-sqlite" }
criterion = { version = "0.8", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sqlx = { version = "0.9", features = ["sqlite", "postgres", "runtime-tokio"] }

[[bench]]
name = "sqlite"
harness = false

[[bench]]
name = "postgres"
harness = false
