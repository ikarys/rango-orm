[package]
name = "rango-cli"
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT"
description = "Rango CLI: makemigrations, migrate, export, import"

[[bin]]
name = "rango"
path = "src/main.rs"

[dependencies]
rango-core     = { path = "../rango-core" }
rango-postgres = { path = "../rango-postgres" }
rango-sqlite   = { path = "../rango-sqlite" }

clap = { version = "4", features = ["derive", "env"] }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
integration = []

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
