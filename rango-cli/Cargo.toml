[package]
name = "rango-cli"
version = "0.1.0-beta.2"
edition = "2024"
license = "MIT"
description = "Rango CLI: makemigrations, migrate, export, import"

[[bin]]
name = "rango"
path = "src/main.rs"

[dependencies]
rango-core     = { path = "../rango-core" }
rango-postgres = { path = "../rango-postgres" }
rango-sqlite   = { path = "../rango-sqlite" }
rango-mysql    = { path = "../rango-mysql" }

clap = { version = "4", features = ["derive", "env"] }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
integration = []
integration-mysql = []

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql"] }
