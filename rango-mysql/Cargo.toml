[package]
name = "rango-mysql"
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"

[dependencies]
rango-core = { path = "../rango-core" }
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_json = "1"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
