[package]
name = "rango-orm-cli"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rango ORM CLI: generated migrations (makemigrations, migrate), export and import"
keywords = ["orm", "database", "migrations", "cli"]
categories = ["command-line-utilities", "database"]
readme = "../README.md"

[[bin]]
name = "rango"
path = "src/main.rs"
doc = false

[dependencies]
rango-orm-core     = { workspace = true }
rango-orm-postgres = { workspace = true }
rango-orm-sqlite   = { workspace = true }
rango-orm-mysql    = { workspace = true }

clap = { version = "4", features = ["derive", "env"] }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
flate2 = "1"

[features]
integration = []
integration-mysql = []

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql", "sqlite"] }
# Contract and real-project tests compile the same models the CLI scans.
rango-orm = { path = "../rango-orm", features = ["postgres", "sqlite", "mysql"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
