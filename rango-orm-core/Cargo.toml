[package]
name = "rango-orm-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Database-free core of Rango ORM: model traits, schema and field types"
keywords = ["orm", "database", "sql"]
categories = ["database"]

[dependencies]
time = { version = "0.3.55", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.6", features = ["getrandom"] }
rust_decimal = "1"
