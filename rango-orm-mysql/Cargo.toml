[package]
name = "rango-orm-mysql"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MySQL 8.0+ / MariaDB 10.6+ backend for Rango ORM (sqlx)"
keywords = ["orm", "database", "mysql", "mariadb", "async"]
categories = ["database", "asynchronous"]

[dependencies]
rango-orm-core = { workspace = true }
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_json = "1"
log = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
