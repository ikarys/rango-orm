[package]
name = "rango-orm-postgres"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PostgreSQL backend for Rango ORM (sqlx)"
keywords = ["orm", "database", "postgres", "async"]
categories = ["database", "asynchronous"]

[dependencies]
rango-orm-core = { workspace = true }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
serde_json = "1"
log = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
