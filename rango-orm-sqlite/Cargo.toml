[package]
name = "rango-orm-sqlite"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SQLite backend for Rango ORM (sqlx)"
keywords = ["orm", "database", "sqlite", "async"]
categories = ["database", "asynchronous"]

[dependencies]
rango-orm-core = { workspace = true }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "uuid", "json"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
serde_json = "1"
futures-core = "0.3"
log = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
