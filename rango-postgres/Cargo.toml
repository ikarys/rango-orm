[package]
name = "rango-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
rango-core = { path = "../rango-core" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
serde_json = "1"
