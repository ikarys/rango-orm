[package]
name = "rango-postgres"
version = "0.1.0-beta.2"
edition = "2024"
license = "MIT"

[dependencies]
rango-core = { path = "../rango-core" }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
serde_json = "1"
log = "0.4"
