[package]
name = "rango-sqlite"
version = "0.1.0"
edition = "2021"

[dependencies]
rango-core = { path = "../rango-core" }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "uuid", "chrono", "json"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_json = "1"
