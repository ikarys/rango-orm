[package]
name = "rango-tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rango-core = { path = "../rango-core" }
rango-derive = { path = "../rango-derive" }

[dev-dependencies]
rango-postgres = { path = "../rango-postgres" }
rango-sqlite   = { path = "../rango-sqlite" }
rango-mysql    = { path = "../rango-mysql" }
rango-core     = { path = "../rango-core" }
rango-derive   = { path = "../rango-derive" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
serde_json = "1"
chrono = "0.4"
sqlx = { version = "0.8", features = ["postgres", "sqlite", "mysql", "runtime-tokio"] }

[features]
integration = []
integration-sqlite = []
integration-mysql = []
