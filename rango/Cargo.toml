[package]
name = "rango"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rango"
path = "src/cli/main.rs"

[dependencies]
# Internal crates
rango-core = { path = "../rango-core" }
rango-derive = { path = "../rango-derive" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Code scanning
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
quote = "1"
walkdir = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "mysql"] }
tokio = { version = "1", features = ["full"] }
