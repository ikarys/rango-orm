[package]
name = "rango"
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT"

[features]
default = ["postgres"]
postgres = ["dep:rango-postgres"]
sqlite = ["dep:rango-sqlite"]
mysql = ["dep:rango-mysql"]

[dependencies]
rango-core     = { path = "../rango-core" }
rango-derive   = { path = "../rango-derive" }
rango-postgres = { path = "../rango-postgres", optional = true }
rango-sqlite   = { path = "../rango-sqlite", optional = true }
rango-mysql    = { path = "../rango-mysql", optional = true }
sqlx = { version = "0.8", default-features = false }
