[package]
name = "rango"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rango"
path = "src/cli/main.rs"

[features]
default = ["sqlite"]
sqlite = ["dep:rango-sqlite"]
# postgres is always available (required by the CLI migrate command)

[dependencies]
# Internal crates
rango-core   = { path = "../rango-core" }
rango-derive = { path = "../rango-derive" }
rango-postgres = { path = "../rango-postgres" }  # always needed for the CLI (migrate command)
rango-sqlite   = { path = "../rango-sqlite", optional = true }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Code scanning
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
quote = "1"
walkdir = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
dotenvy = "0.15"
toml = "0.8"

# DB (runtime only — actual features come from the backend crates)
sqlx = { version = "0.8", features = ["runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
